{% extends 'base.html' %}
{% block title %}填写问卷 - {{ survey.title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h4 mb-2">{{ survey.title }}</h1>
                <p class="text-muted">{{ survey.description }}</p>
                <form method="post" class="mt-4">
                    {% for question in questions %}
                    <div class="mb-3">
                        <label class="form-label">{{ loop.index }}. {{ question }}</label>
                        <textarea class="form-control" name="q{{ loop.index0 }}" rows="2" required></textarea>
                    </div>
                    {% endfor %}
                    <div class="d-grid">
                        <button class="btn btn-primary" type="submit">提交问卷</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
